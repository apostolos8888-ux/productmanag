name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for build only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "DiacheirisiProionton" app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DiacheirisiProionton-Windows
          path: dist/DiacheirisiProionton.exe
          if-no-files-found: error
